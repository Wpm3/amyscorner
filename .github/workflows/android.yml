name: Android build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # lets a tagged build publish a GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies (also generates the offline PDF engine)
        run: npm ci

      - name: Test
        run: npm test

      # android/ is generated from app.json (Continuous Native Generation), never committed.
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # The Expo template signs release builds with the debug keystore, so the APK
      # installs directly on a phone (sideload). Use EAS or a real keystore for Play Store.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk Unfold.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Unfold-Android
          path: Unfold.apk
          if-no-files-found: error

      # On a v* tag, attach the APK to a public release so it can be downloaded
      # without a GitHub sign-in: .../releases/latest/download/Unfold.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Unfold.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" Unfold.apk \
              --title "Unfold $GITHUB_REF_NAME" \
              --notes "Android: download **Unfold.apk**, open it on your phone or tablet, and allow \"Install unknown apps\" when asked. Signed with a debug key, for sideloading only."
          fi
